<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>File Transfer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="eyebrow">LOCAL · LOSSLESS · PRIVATE</div>
        <h1>File Transfer</h1>
        <p>在文件和无损 PNG 图片之间转换。全部数据只在本机处理。</p>
      </header>

      <section class="card">
        <div class="tabs" role="tablist" aria-label="转换模式">
          <button class="tab active" data-mode="encode" role="tab">文件 → 图片</button>
          <button class="tab" data-mode="decode" role="tab">图片 → 文件</button>
        </div>

        <div id="drop-zone" class="drop-zone" tabindex="0" role="button">
          <input id="file-input" type="file" hidden />
          <div class="drop-icon" aria-hidden="true">⇧</div>
          <strong id="drop-title">选择或拖入任意文件</strong>
          <span id="drop-subtitle">单个文件，最大 100 MiB</span>
        </div>

        <div id="file-info" class="file-info hidden">
          <div>
            <span class="label">已选择</span>
            <strong id="file-name"></strong>
          </div>
          <span id="file-size" class="pill"></span>
        </div>

        <label id="zip-option" class="option-row">
          <input id="zip-output" type="checkbox" />
          <span>
            <strong>转换后打包为 ZIP</strong>
            <small>ZIP 内包含生成的 PNG 图片</small>
          </span>
        </label>

        <button id="action-button" class="primary" disabled>转换为 PNG</button>
        <div id="status" class="status hidden" aria-live="polite"></div>
        <a id="download" class="download hidden">下载结果</a>
      </section>

      <aside class="notice">
        <strong>请保留原始 PNG</strong>
        <span>图片被缩放、裁剪、调色或转换成 JPEG 后将无法还原。</span>
      </aside>

      <footer>
        <span id="runtime">File Transfer Format v1.0</span>
        <span>仅监听 127.0.0.1</span>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
